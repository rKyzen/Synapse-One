[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapse-core"
version = "0.1.0"
description = "Synapse One AI Operating Workspace - Python AI Core"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Synapse One" }]
keywords = ["ai", "orchestration", "workspace", "local-first"]
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "structlog>=24.1,<26",
    "psutil>=5.9,<8",
    "tomli>=2.0,<3; python_version < '3.11'",
    "faiss-cpu>=1.9,<2",
    "pypdf>=4,<7",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
]
server = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/synapse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
