# Synapse One — default configuration
# Layered with env vars and secret files. Never commit real keys here.

[logging]
level = "INFO"
json = false

# Task Planner — decomposes large prompts into a task DAG.
#   enabled             : set false to always treat the whole prompt as one task
#   min_split_complexity: below this complexity score, no decomposition
#   max_tasks           : ceiling on the number of execution tasks
# Phase 6:
#   file_output_enabled : detect "create/write/generate/refactor" prompts and
#                         expect a structured file manifest from the model
#   add_review          : append a REVIEW task routed to the strongest
#                         available reasoning model after file tasks
#   model_hints         : kind -> preferred model id, e.g.
#                         { coding = "qwen2.5-coder", writing = "llama3.1" }
#   goal_mode           : AI Operating Workspace (Phase B). When true, goals
#                         created via POST /projects/{id}/goals are the primary
#                         intake; when false, the legacy /request path is the
#                         only entry point. Goals always persist either way.
[planner]
enabled = true
min_split_complexity = 40
max_tasks = 6
file_output_enabled = true
add_review = true
model_hints = {}
goal_mode = false

# AI Master Agent / Task Divider (model-backed decomposition).
#   enabled      : route decomposition through a small LLM that emits a
#                  structured TaskDecompositionPlan JSON graph (Ollama
#                  structured outputs). Disabled = deterministic heuristic
#                  planner only. Any Master AI failure falls back to the
#                  deterministic planner — never a hard error.
#   temperature  : near zero — the divider is a router, not a generator.
#   max_retries  : extra attempts after the first (invalid JSON / timeout).
#   max_tasks    : ceiling on how many sub-tasks a plan may contain.
#   tiers.*      : candidate model ids per hardware tier (preference order).
#                  The first registered + healthy candidate is chosen.
#   resolver.*   : tier boundaries in GB (available RAM / VRAM).
[master_agent]
enabled = true
temperature = 0.1
max_retries = 1
max_tasks = 8

[master_agent.tiers]
tier1 = ["gemma3:1b", "qwen2.5:1.5b", "llama3.2:1b", "qwen3:1.7b"]
tier2 = ["gemma3:1b", "qwen2.5:1.5b", "llama3.2:1b", "qwen3:1.7b"]
tier3 = ["gemma3:1b", "qwen2.5:1.5b", "llama3.2:1b", "qwen3:1.7b"]
tier3_plus = ["gemma3:1b", "qwen2.5:1.5b", "llama3.2:1b", "qwen3:1.7b"]
cloud = ["gpt-4o-mini", "gemini-2.5-flash"]

[master_agent.resolver]
tier2_min_ram_gb = 6.0
tier3_min_ram_gb = 16.0
tier3_min_vram_gb = 12.0
tier3_plus_min_ram_gb = 32.0
tier3_plus_min_vram_gb = 20.0
cloud_max_ram_gb = 0.5

# Workspace Memory — scoped (conversation/project/global) semantic memory.
#   embedding_model : model used for embeddings (must be installed in Ollama)
#   top_k           : results returned per search
#   min_similarity  : cosine threshold; below it, entries are dropped
[memory]
enabled = true
embedding_model = "nomic-embed-text"
top_k = 3
min_similarity = 0.35

# Workspace (Phase 4) — multimodal file intake + RAG.
#   storage_dir          : relative to the data dir
#   chunk_size/overlap   : document chunking (characters)
#   code_chunk_lines     : code chunking (lines)
#   embedding_model      : embeddings for RAG (must be installed in Ollama)
#   vision_model         : local vision model for images (must be pulled)
#   top_k                : retrieved chunks per question
#   min_similarity       : retrieval cosine threshold
#   embed_batch_size     : vectors per API call
#   allow_cloud_forwarding : false = document content NEVER leaves the device
#   auto_retrieve        : answer follow-ups from prior uploads automatically
[workspace]
enabled = true
storage_dir = "workspace"
chunk_size = 1200
chunk_overlap = 200
code_chunk_lines = 200
code_chunk_overlap = 20
embedding_model = "nomic-embed-text"
vision_model = "qwen2.5vl:7b"
top_k = 4
min_similarity = 0.25
embed_batch_size = 16
allow_cloud_forwarding = false
auto_retrieve = true
code_scan_patterns = ["TODO", "FIXME", "HACK", "XXX"]
code_scan_triggers = ["todo", "fixme", "hack"]

# file-type → pipeline mapping (image | document | code)
[workspace.pipelines]
image = ["png", "jpg", "jpeg", "webp", "gif", "bmp"]
document = ["pdf", "docx", "txt", "md", "markdown", "rtf"]
code = ["py", "js", "ts", "dart", "rs", "go", "java", "c", "cpp", "h", "hpp", "cs", "rb", "php", "sh", "bash", "ps1", "sql", "html", "css", "scss", "json", "jsonc", "yaml", "yml", "toml", "xml", "proto", "kt", "swift"]

# Local vector database backend: "faiss" (default) or "local" (numpy).
[vector_store]
provider = "faiss"

# Phase 2.5 — performance learning loop. Per-model execution stats are
# recorded after every request and fed back into routing (latency prediction).
[performance]
enabled = true
max_entries = 500

# Model lifecycle & resource management (Phase 2.5+).
# Timeouts in seconds; the cleanup loop runs every `cleanup_interval` seconds
# and unloads models that have been idle longer than their class timeout.
# Negative/floating values are allowed; set a large timeout to effectively
# keep a class resident. A model must be idle (not generating) to be unloaded.
[lifecycle]
idle_timeout_small = 60          # general (small/medium) models
idle_timeout_large = 30          # large models (>= large_model_min_ram_gb)
idle_timeout_embedding = 3600    # only used if keep_embedding_loaded = false
cleanup_interval = 15            # background sweep period
keep_embedding_loaded = true     # never auto-unload embedding models
low_memory_threshold = 4         # GB of free RAM; below this, unload all idle
prefer_loaded_model_margin = 0.05 # reuse an already-loaded model if capability
                                  # gap is smaller than this (0.05 == 5%)
large_model_min_ram_gb = 8.0     # models needing >= this RAM are "large"
max_loaded_models = 4            # soft cap for the resident-model sweep

# Phase 4 — answer quality & reliability.
#   refuse_threshold   : confidence below this -> refuse/hedge instead of guessing
#   verify_threshold   : confidence below this -> run multi-step verification
#   escalate_threshold : confidence below this -> retry with a stronger model
[confidence]
refuse_threshold = 0.3
verify_threshold = 0.7
escalate_threshold = 0.6

# Phase 4 — context builder budget (characters for the final prompt bundle).
[context]
max_chars = 8000

[providers.ollama]
enabled = true
base_url = "http://localhost:11434"
# Installed per hardware tier by SetupModels.bat (see models.json). When this
# model is not installed the provider falls back to the first installed model.
default_model = "gemma3:4b"

# Timeouts (seconds). Local CPU inference is slow — generous defaults.
#   connect    : time to establish the TCP connection
#   read       : max idle gap between streamed chunks (model "thinking" time)
#   generation : total wall-clock budget; exceeded mid-stream, partial output is returned
[providers.ollama.timeouts]
connect = 10
read = 180
generation = 180

[providers.openai]
enabled = false
base_url = "https://api.openai.com/v1"
# Supply via env: SYNAPSE_PROVIDERS_OPENAI_API_KEY or a secret file:
# api_key_file = "C:/path/to/openai.key"
api_key_env = "OPENAI_API_KEY"
default_model = "gpt-4o-mini"

[providers.gemini]
enabled = false
# api_key_env = "GEMINI_API_KEY"
default_model = "gemini-1.5-flash"

# ---------------------------------------------------------------------------
# Model catalog — weighted capability profiles (0.0..1.0) per model.
# The router treats these as SPECIALISTS: it matches the task's required and
# preferred capabilities against every profile and picks the best fit.
# All values are configurable; nothing is hardcoded in code.
#
# Which models get INSTALLED is decided by the hardware tier (SetupModels.bat
# + models.json, the single source of truth for recommendations). The catalog
# below only carries capability knowledge: profiles for models that are not
# installed are ignored, and installed models without a profile get safe
# name-based defaults. Either hardware tier therefore routes correctly.
# ---------------------------------------------------------------------------

